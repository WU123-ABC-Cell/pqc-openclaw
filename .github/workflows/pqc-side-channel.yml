name: PQC side-channel

# This workflow has two explicit guarantees:
# 1. the Linux N-API mlock backend builds, loads, and completes a real
#    mlock(2)/munlock(2) round trip; and
# 2. every checked-in cache-timing evidence report still satisfies the
#    published threshold. The evidence check is an integrity gate, not a fresh
#    timing measurement of the current runner.

on:
  push:
    branches: [master, pqc/**]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pqc-side-channel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-mlock:
    name: Linux native mlock backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Node and dependencies
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.x"
          install-bun: "false"

      - name: Build native addon
        run: pnpm build:native

      - name: Require a real mlock round trip
        run: |
          node <<'NODE'
          const addon = require("./src/security/native/mlock-addon.cjs");
          if (!addon.isAvailable()) {
            throw new Error(`native addon unavailable: ${addon.loadError()}`);
          }
          const key = Buffer.alloc(32, 0x5a);
          const locked = addon.mlockSync(key);
          const unlocked = addon.munlockSync(key);
          if (locked !== key.length || unlocked !== key.length) {
            throw new Error(`unexpected native result: locked=${locked}, unlocked=${unlocked}`);
          }
          console.log("native mlock backend completed a 32-byte round trip");
          NODE

      - name: Run mlock helper tests with the addon present
        run: node scripts/run-vitest.mjs run src/security/mlock-helper.test.ts

  cache-timing-evidence:
    name: Cache-timing evidence integrity (14 reports)
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Node
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.x"
          install-bun: "false"
          install-deps: "false"

      - name: Validate checked-in timing evidence
        run: node scripts/check-pqc-cache-timing-evidence.mjs
