name: PQC deploy validation

# An isolated install job validates the committed workspace without changing
# host users, services, or keyrings. Additional harnesses validate the installer interface,
# healthcheck, backup, Compose structure, and Prometheus collector. These jobs
# do not claim to start a production gateway.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pqc-deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-validate:
    name: Static deploy-script validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Check shell syntax and harness inventory
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            scripts/install-pqc.sh \
            scripts/healthcheck-pqc.sh \
            scripts/backup-pqc.sh \
            scripts/pqc-textfile-collector.sh; do
            bash -n "$file"
          done
          for harness in install healthcheck backup compose prom; do
            test -f "scripts/pqc-e2e/${harness}.py"
          done

  deploy-harness:
    name: "Harness: ${{ matrix.harness }}"
    needs: static-validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        harness: [install, healthcheck, backup, compose, prom]

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup repository YAML parser
        if: matrix.harness == 'compose'
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.x"
          install-bun: "false"

      - name: Run isolated harness
        run: python3 "scripts/pqc-e2e/${{ matrix.harness }}.py"

  install-workspace:
    name: Install committed workspace in an isolated prefix
    needs: static-validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.x"
          install-bun: "false"
          install-deps: "false"

      - name: Run complete installer without host service changes
        shell: bash
        run: |
          set -euo pipefail
          sandbox_root=$(mktemp -d "${RUNNER_TEMP}/pqc-install.XXXXXX")
          node_version=$(node -p 'process.versions.node')
          bash scripts/install-pqc.sh \
            --sandbox-root "$sandbox_root" \
            --node-version "$node_version"

          install_root="$sandbox_root/opt/pqc-openclaw"
          state_dir="$sandbox_root/var/lib/pqc-openclaw"
          bin_dir="$sandbox_root/usr/local/bin"
          unit="$sandbox_root/etc/systemd/system/pqc-openclaw.service"
          backup_service="$sandbox_root/etc/systemd/system/pqc-openclaw-backup.service"
          backup_timer="$sandbox_root/etc/systemd/system/pqc-openclaw-backup.timer"
          test -f "$install_root/pnpm-workspace.yaml"
          test -d "$install_root/packages"
          test -d "$install_root/extensions"
          test -f "$install_root/src/security/native/mlock-addon.d.cts"
          test -d "$install_root/node_modules"
          test -f "$install_root/dist/index.js"
          test -f "$unit"
          test -f "$backup_service"
          test -f "$backup_timer"
          test "$(stat -c %a "$state_dir/wrap-key.b64")" = "600"
          test "$(stat -c %a "$state_dir/openclaw.env")" = "600"
          test "$(wc -c < "$state_dir/wrap-key.b64")" -ge 43
          grep -q '^OPENCLAW_GATEWAY_TOKEN=[0-9a-f]\{64\}$' "$state_dir/openclaw.env"
          grep -Fq "WorkingDirectory=$install_root" "$unit"
          grep -Fq "EnvironmentFile=-$state_dir/openclaw.env" "$unit"
          grep -Fq "ReadWritePaths=$state_dir" "$unit"
          grep -Fq "ExecStart=$(command -v node) $install_root/dist/index.js gateway" "$unit"
          grep -Fq "User=$(id -un)" "$backup_service"
          grep -Fq -- "--state-dir $state_dir" "$backup_service"
          grep -Fq -- "--backup-dir $sandbox_root/var/backups/pqc-openclaw" "$backup_service"
          grep -Fq "SuccessExitStatus=2" "$backup_service"
          grep -Fq "OnCalendar=*-*-* 03:00:00" "$backup_timer"
          grep -Fq "Persistent=true" "$backup_timer"

          for wrapper in healthcheck-pqc.sh backup-pqc.sh pqc-textfile-collector.sh; do
            test -x "$bin_dir/$wrapper"
            "$bin_dir/$wrapper" --help >"$RUNNER_TEMP/$wrapper.out" 2>"$RUNNER_TEMP/$wrapper.err"
            test ! -s "$RUNNER_TEMP/$wrapper.err"
          done
