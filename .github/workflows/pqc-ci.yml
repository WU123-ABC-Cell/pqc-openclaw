name: PQC CI

# Fast, fork-specific coverage. The upstream workflows own the broad test and
# build matrix; this workflow exercises the production paths changed by the
# PQC fork and never treats a missing test asset as success.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pqc-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pqc-core:
    name: PQC production integration (Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Node and dependencies
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.x"
          install-bun: "false"

      - name: Type-check production code
        run: pnpm tsgo:core

      - name: Run focused PQC integration tests
        run: >-
          node scripts/run-vitest.mjs run
          src/infra/device-identity-store.wrap.test.ts
          src/infra/mldsa65-kat.test.ts
          src/security/keyring-provider.test.ts
          src/security/nip44-v2.test.ts
          src/security/push-dual-signature.test.ts
          src/security/secret-wrapping.test.ts
          src/security/wrap-key-rotation.test.ts
          src/state/openclaw-state-db-schema-additive.test.ts
          src/state/openclaw-state-db.test.ts
